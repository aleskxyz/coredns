name: Docker Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Release (e.g., v1.9.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker-release:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ github.event.inputs.release || github.event.release.tag_name }}
      IMAGE_REPO: ${{ format('ghcr.io/{0}', github.repository_owner) }}
      RELEASE_DOWNLOAD_BASE: ${{ format('https://github.com/{0}/releases/download', github.repository) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Build Docker Images
        run: make VERSION=${RELEASE:1} DOCKER=${IMAGE_REPO} GITHUB=${RELEASE_DOWNLOAD_BASE} -f Makefile.docker release
      - name: Show Docker Images
        run: docker images
      - name: GHCR login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish Docker Images
        run: make VERSION=${RELEASE:1} DOCKER=${IMAGE_REPO} -f Makefile.docker docker-push
